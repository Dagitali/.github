# $schema: https://json.schemastore.org/github-action.json
# actions/cdk-quality/action.yml
# Dagitali shared automation library
#
# Responsibilities
# - Run quality checks and offline CDK synthesis in the caller environment.
# - Propagate check failures without installing or repairing dependencies.
#
# Maintainer Notes
# - The caller installs runtimes and dependencies; preserve workflow parity.
# - Check out source and install the CDK CLI before invoking this action.
# - Optional quality commands may be empty; synthesis remains required.
# - Synthesis executes caller code; do not supply deployment credentials.
# - Keep report paths, artifact uploads, and failure conditions in the caller.

---
name: AWS CDK quality checks
description: Run configurable quality checks and synthesize an AWS CDK application.

inputs:
  working-directory:
    description: Directory containing cdk.json.
    required: false
    default: .
  format-command:
    description: Formatting check; empty skips it.
    required: false
    default: ''
  lint-command:
    description: Lint command; empty skips it.
    required: false
    default: ''
  test-command:
    description: Test command; empty skips it.
    required: false
    default: ''
  synth-command:
    description: CDK synthesis command.
    required: false
    default: cdk synth --quiet

runs:
  using: composite
  steps:
    - name: Check formatting
      if: inputs.format-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.format-command }}
      run: bash -euo pipefail -c "$COMMAND"

    - name: Lint
      if: inputs.lint-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.lint-command }}
      run: bash -euo pipefail -c "$COMMAND"

    - name: Test
      if: inputs.test-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.test-command }}
      run: bash -euo pipefail -c "$COMMAND"

    - name: Synthesize CloudFormation
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.synth-command }}
      run: bash -euo pipefail -c "$COMMAND"
