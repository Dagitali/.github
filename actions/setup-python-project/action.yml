name: Set up Python project
description: Install Python, enable pip caching, and install a project with one command.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: '3.13'
  working-directory:
    description: Directory containing the Python project.
    required: false
    default: .
  cache-dependency-path:
    description: Dependency path relative to checkout; empty uses working-directory/pyproject.toml.
    required: false
    default: ''
  install-command:
    description: Command that installs the project and development dependencies.
    required: false
    default: python -m pip install -e '.[dev]'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/pyproject.toml', inputs.working-directory) }}

    - name: Install project
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.install-command }}
      run: bash -euo pipefail -c "$COMMAND"

    - name: Verify dependency compatibility
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: python -m pip check
