# $schema: https://json.schemastore.org/github-action.json
# actions/setup-python-project/action.yml
# Dagitali shared automation library
#
# Responsibilities
# - Set up Python and optionally run a trusted installation command.
# - Reject unsupported cache selectors before runtime setup.
#
# Maintainer Notes
# - Check out first; preserve setup parity and empty-command behavior.

name: Set up Python project
description: Set up cached Python and optionally install dependencies with a caller-owned command.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: '3.13'
  working-directory:
    description: Directory containing the Python project.
    required: false
    default: .
  cache-dependency-path:
    description: Dependency path relative to checkout; empty uses working-directory/pyproject.toml.
    required: false
    default: ''
  cache:
    description: setup-python cache manager; pip, pipenv, poetry, or empty to disable caching.
    required: false
    default: pip
  install-command:
    description: Trusted installation command; empty sets up Python without installing dependencies.
    required: false
    default: python -m pip install -e '.[dev]'

runs:
  using: composite
  steps:
    - name: Validate Python cache
      shell: bash
      env:
        PYTHON_CACHE: ${{ inputs.cache }}
      run: |
        case "$PYTHON_CACHE" in
          ''|pip|pipenv|poetry) ;;
          *)
            echo 'Python cache must be pip, pipenv, poetry, or empty.' >&2
            exit 2
            ;;
        esac

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/pyproject.toml', inputs.working-directory) }}

    - name: Install project
      if: inputs.install-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.install-command }}
      run: bash -euo pipefail -c "$COMMAND"

    - name: Verify dependency compatibility
      if: inputs.install-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: python -m pip check

    - name: Report Python environment
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python --version
        python -m pip --version
