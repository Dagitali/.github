# Replace REPLACE_WITH_RELEASE_SHA with a tested Dagitali/.github commit before use.
name: Python CI

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]
  merge_group:

permissions: {}

jobs:
  python-ci:
    permissions:
      contents: read
    uses: Dagitali/.github/.github/workflows/python-ci.yml@REPLACE_WITH_RELEASE_SHA
    with:
      python-versions: '["3.13", "3.14"]'
