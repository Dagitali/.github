# $schema: https://json.schemastore.org/github-workflow.json
# workflow-templates/aws-cdk-ci.yml
# Dagitali shared automation library
#
# Responsibilities
# - Provide a minimal consumer-owned workflow starter.
# - Cancel stale CI runs for the same workflow and ref, not other callers.
#
# Maintainer Notes
# - Replace the release-SHA placeholder before use; preserve caller
#   permissions.

# Replace REPLACE_WITH_RELEASE_SHA with a tested Dagitali/.github commit before
# use.
name: AWS CDK CI

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]
  merge_group:

permissions: {}

concurrency:
  group: consumer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdk-ci:
    permissions:
      contents: read
    uses: Dagitali/.github/.github/workflows/aws-cdk-ci.yml@REPLACE_WITH_RELEASE_SHA
    with:
      language: python
      format-command: ruff format --check .
      lint-command: ruff check .
      test-command: pytest
