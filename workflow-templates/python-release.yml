# $schema: https://json.schemastore.org/github-workflow.json
# workflow-templates/python-release.yml
# Dagitali shared automation library
#
# Responsibilities
# - Provide a minimal consumer-owned workflow starter.
#
# Maintainer Notes
# - Replace the release-SHA placeholder before use; preserve caller
#   permissions.

# Replace REPLACE_WITH_RELEASE_SHA with a tested Dagitali/.github commit before
# use.
name: Python release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  package:
    permissions:
      contents: read
    uses: Dagitali/.github/.github/workflows/python-package.yml@REPLACE_WITH_RELEASE_SHA

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers and allowed release tags on this environment.
    # Register THIS caller workflow filename and environment with PyPI.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-dist
          path: dist
      - name: Publish using trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
