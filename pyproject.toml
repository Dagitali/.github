# pyproject.toml
# Dagitali shared automation library
#
# Responsibilities
# - Configure Popo consumer policy, pytest, Ruff, and strict Python typing.
#
# Maintainer Notes
# - This root is an automation library, not an installable Python package.
# - Fixture projects own their runtime dependencies and type-check settings.

# Consumer policy and test configuration; this is not a Python distribution.

[tool.mypy]
python_version = "3.13"
strict = true
files = ["tests"]
exclude = ["^tests/fixtures/"]

[tool.popo.automation]
workflow-globs = [".github/workflows/*.yml"]
action-globs = ["actions/*/action.yml"]
template-globs = ["workflow-templates/*.yml"]
yaml-globs = [".github/ISSUE_TEMPLATE/*.yml", ".github/*.yml", ".pre-commit-config.yaml"]
local-repositories = ["Dagitali/.github"]
template-placeholder-refs = ["REPLACE_WITH_RELEASE_SHA"]

[tool.popo.hosted]
# Desired baseline, not a claim of enforcement or approval of deviations.
# No exceptions are approved by this configuration change.
exceptions = []

[[tool.popo.hosted.repositories]]
name = "Dagitali/.github"
codeowners = true
labels = ["bug", "enhancement", "documentation"]
settings = { private-vulnerability-reporting = true, secret-scanning = true, secret-scanning-push-protection = true }
branches = { main = ["validate"], develop = ["validate"] }

[[tool.popo.hosted.repositories]]
name = "Dagitali/aws-cdk-static-site"
codeowners = true
labels = ["bug", "enhancement", "documentation"]
settings = { private-vulnerability-reporting = true, secret-scanning = true, secret-scanning-push-protection = true }
branches = { main = ["Validate pull request"], develop = ["Validate pull request"] }

[tool.popo.safety]
# Enforced by published Popo hrough lint and self-check.
# Keep CI on the published pin, never a sibling source-path override.
workflow-globs = [".github/workflows/*.yml", "workflow-templates/*.yml"]
exceptions = []
npm-pairs = [
  { manifest = "tests/fixtures/node-cdk/package.json", lockfile = "tests/fixtures/node-cdk-locked/package-lock.json" },
  { manifest = "tests/fixtures/node-cdk-locked/package.json", lockfile = "tests/fixtures/node-cdk-locked/package-lock.json" },
]

[tool.pytest]
minversion = "9.1.1"
testpaths = ["tests"]
norecursedirs = ["fixtures", ".git", ".venv"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "single"
nested-string-quote-style = "preferred"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
