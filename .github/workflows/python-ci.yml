name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test.
        type: string
        default: '["3.13", "3.14"]'
      runs-on:
        description: GitHub-hosted runner label.
        type: string
        default: ubuntu-latest
      working-directory:
        description: Directory containing the Python project.
        type: string
        default: .
      cache-dependency-path:
        description: Dependency path relative to checkout; empty uses working-directory/pyproject.toml.
        type: string
        default: ''
      install-command:
        description: Command that installs the project and CI dependencies.
        type: string
        default: python -m pip install -e '.[dev]'
      format-command:
        description: Formatting check; set to an empty string to skip.
        type: string
        default: ruff format --check .
      lint-command:
        description: Lint command; set to an empty string to skip.
        type: string
        default: ruff check .
      typecheck-command:
        description: Type-check command; set to an empty string to skip.
        type: string
        default: mypy .
      test-command:
        description: Test command; set to an empty string to skip.
        type: string
        default: pytest

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.cache-dependency-path || format('{0}/pyproject.toml', inputs.working-directory) }}

      - name: Install project
        env:
          COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Check formatting
        if: inputs.format-command != ''
        env:
          COMMAND: ${{ inputs.format-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Lint
        if: inputs.lint-command != ''
        env:
          COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Type-check
        if: inputs.typecheck-command != ''
        env:
          COMMAND: ${{ inputs.typecheck-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Test
        if: inputs.test-command != ''
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"
