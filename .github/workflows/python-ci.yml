# $schema: https://json.schemastore.org/github-workflow.json
# .github/workflows/python-ci.yml
# Dagitali shared automation library
#
# Responsibilities
# - Run caller-configured Python installation and quality checks.
# - Reject unsupported cache selectors before runtime setup.
#
# Maintainer Notes
# - Compose same-revision setup/quality actions and propagate failures.
# - Self-repository action references require GitHub.com, not GHES.
# - Caller workflows own triggers and cancellation, not this shared workflow.
# - Command inputs execute caller code; they are not a sandbox boundary.

name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test.
        type: string
        default: '["3.13", "3.14"]'
      runs-on:
        description: GitHub-hosted runner label.
        type: string
        default: ubuntu-latest
      working-directory:
        description: Directory containing the Python project.
        type: string
        default: .
      cache-dependency-path:
        description: Dependency path relative to checkout; empty uses working-directory/pyproject.toml.
        type: string
        default: ''
      cache:
        description: setup-python cache manager; pip, pipenv, poetry, or empty to disable caching.
        type: string
        default: pip
      install-command:
        description: Trusted installation command; empty skips installation and its compatibility check.
        type: string
        default: python -m pip install -e '.[dev]'
      format-command:
        description: Formatting check; set to an empty string to skip.
        type: string
        default: ruff format --check .
      lint-command:
        description: Lint command; set to an empty string to skip.
        type: string
        default: ruff check .
      typecheck-command:
        description: Type-check command; set to an empty string to skip.
        type: string
        default: mypy .
      test-command:
        description: Test command; set to an empty string to skip.
        type: string
        default: pytest
      diagnostics-path:
        description: Optional report/log paths relative to checkout; empty disables upload.
        type: string
        default: ''
      diagnostics-name:
        description: Diagnostic artifact prefix; runner and Python version are appended.
        type: string
        default: python-diagnostics
      diagnostics-retention-days:
        description: Diagnostic retention in days, subject to repository limits.
        type: number
        default: 7

permissions: {}

jobs:
  quality:
    permissions:
      contents: read
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python project
        uses: $/actions/setup-python-project
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: ${{ inputs.working-directory }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          install-command: ${{ inputs.install-command }}

      - name: Run Python quality checks
        uses: $/actions/python-quality
        with:
          working-directory: ${{ inputs.working-directory }}
          format-command: ${{ inputs.format-command }}
          lint-command: ${{ inputs.lint-command }}
          typecheck-command: ${{ inputs.typecheck-command }}
          test-command: ${{ inputs.test-command }}

      - name: Upload diagnostics
        if: ${{ always() && !cancelled() && inputs.diagnostics-path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.diagnostics-name }}-${{ inputs.runs-on }}-${{ matrix.python-version }}
          path: ${{ inputs.diagnostics-path }}
          if-no-files-found: warn
          retention-days: ${{ inputs.diagnostics-retention-days }}
