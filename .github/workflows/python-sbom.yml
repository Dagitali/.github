# $schema: https://json.schemastore.org/github-workflow.json
# .github/workflows/python-sbom.yml
# Dagitali shared automation library
#
# Responsibilities
# - Inspect caller-selected Python dependencies in an isolated environment.
# - Keep inspection tooling separate and retain machine-readable evidence.
#
# Maintainer Notes
# - Installs execute caller code; use trusted code without credentials.
# - Never publish, deploy, or automatically repair dependencies.

name: Reusable Python Dependency Inventory

on:
  workflow_call:
    inputs:
      python-version:
        description: Python runtime for the inspected environment.
        type: string
        default: '3.13'
      working-directory:
        description: Caller project directory.
        type: string
        default: .
      install-command:
        description: Installation command in the isolated target environment; no dev extras by default.
        type: string
        default: python -m pip install .
      tool-version:
        description: Exact cyclonedx-bom version; transitive tools remain resolver-selected.
        type: string
        default: '7.2.2'
      artifact-name:
        description: Unique evidence artifact name.
        type: string
        default: python-sbom
      artifact-retention-days:
        description: Evidence retention in days, subject to repository limits.
        type: number
        default: 14

permissions: {}

jobs:
  inspect:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Initialize inspection paths
        working-directory: .
        run: |
          {
            echo "TARGET_ENV=$RUNNER_TEMP/inspection-target"
            echo "TOOL_ENV=$RUNNER_TEMP/inspection-tools"
            echo "REPORT_PATH=$RUNNER_TEMP/python-sbom.json"
          } >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Prepare isolated inspection environments
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          TOOL_VERSION: ${{ inputs.tool-version }}
        run: |
          [[ -n "$INSTALL_COMMAND" ]]
          python -m venv "$TARGET_ENV"
          python -m venv "$TOOL_ENV"
          env -u PYTHONPATH -u PYTHONHOME VIRTUAL_ENV="$TARGET_ENV" \
            PATH="$TARGET_ENV/bin:$PATH" PYTHON="$TARGET_ENV/bin/python" \
            bash -euo pipefail -c "$INSTALL_COMMAND"
          "$TARGET_ENV/bin/python" -m pip check
          "$TOOL_ENV/bin/python" -m pip install "cyclonedx-bom==$TOOL_VERSION"
      - name: Generate validated dependency inventory
        run: |
          "$TOOL_ENV/bin/python" -m cyclonedx_py environment \
            "$TARGET_ENV/bin/python" --output-format JSON --validate \
            --output-file "$REPORT_PATH"
      - name: Upload inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.REPORT_PATH }}
          archive: true
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
