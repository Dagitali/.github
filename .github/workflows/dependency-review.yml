name: Reusable Dependency Review

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: Lowest vulnerability severity that fails the workflow.
        type: string
        default: moderate
      fail-on-scopes:
        description: Comma-separated dependency scopes that can fail the workflow.
        type: string
        default: runtime
      deny-licenses:
        description: Comma-separated SPDX license identifiers to deny; empty disables license denial.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          fail-on-scopes: ${{ inputs.fail-on-scopes }}
          deny-licenses: ${{ inputs.deny-licenses }}
