name: Reusable Python Package CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to build the distribution.
        type: string
        default: '3.13'
      working-directory:
        description: Directory containing pyproject.toml.
        type: string
        default: .
      artifact-name:
        description: Name of the uploaded distribution artifact.
        type: string
        default: python-dist

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ format('{0}/pyproject.toml', inputs.working-directory) }}

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ format('{0}/dist/', inputs.working-directory) }}
          if-no-files-found: error
