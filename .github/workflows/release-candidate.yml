# $schema: https://json.schemastore.org/github-workflow.json
# .github/workflows/release-candidate.yml
# Dagitali shared automation library
#
# Responsibilities
# - Expand fixture validation through manual candidate runs.
# - Validate the library itself across supported Python runtimes.
#
# Maintainer Notes
# - Retain unique artifact names and a non-publishing release boundary.

name: Release candidate validation
run-name: Release candidate validation on ${{ github.ref_name }}

# Select the candidate branch/ref in GitHub's manual-run UI. Never publishes.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate library (Python ${{ matrix.python-version }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./actions/setup-python-project
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-path: requirements-dev.txt
          install-command: python -m pip install -r requirements-dev.txt
      - name: Install validation tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          command -v shellcheck
      - run: make check

  python:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    uses: ./.github/workflows/python-ci.yml
    with:
      runs-on: ${{ matrix.runner }}
      working-directory: tests/fixtures/python

  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    uses: ./.github/workflows/python-package.yml
    with:
      python-version: ${{ matrix.python }}
      working-directory: tests/fixtures/python
      artifact-name: candidate-python-dist-${{ matrix.python }}
      smoke-command: python -c 'import dagitali_fixture; assert dagitali_fixture.add(2, 3) == 5'

  cdk:
    permissions:
      contents: read
    uses: ./.github/workflows/aws-cdk-ci.yml
    with:
      language: node
      cdk-version: '2.1144.0'
      working-directory: tests/fixtures/node-cdk
      test-command: npm test

  swift:
    permissions:
      contents: read
    uses: ./.github/workflows/swift-ci.yml
    with:
      runners: '["macos-15", "macos-latest"]'
      working-directory: tests/fixtures/swift
      build-command: swift build --build-tests > build.log 2>&1
      test-command: swift test --parallel > test.log 2>&1
      diagnostics-path: |
        tests/fixtures/swift/build.log
        tests/fixtures/swift/test.log

  python-cdk:
    permissions:
      contents: read
    uses: ./.github/workflows/aws-cdk-ci.yml
    with:
      language: python
      cdk-version: '2.1144.0'
      working-directory: tests/fixtures/python-cdk
      format-command: ruff format --check .
      lint-command: ruff check .
      test-command: pytest --junitxml=test-results.xml
      synth-command: cdk synth --quiet > synth.log 2>&1
      diagnostics-name: candidate-python-cdk-diagnostics
      diagnostics-path: |
        tests/fixtures/python-cdk/test-results.xml
        tests/fixtures/python-cdk/synth.log
