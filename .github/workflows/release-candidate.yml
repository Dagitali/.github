# $schema: https://json.schemastore.org/github-workflow.json
# .github/workflows/release-candidate.yml
# Dagitali shared automation library
#
# Responsibilities
# - Expand fixture validation through manual candidate runs.
# - Validate the library itself across supported Python runtimes.
# - Append candidate evidence before rejecting incomplete validation.
#
# Maintainer Notes
# - Retain unique artifact names and a non-publishing release boundary.
# - Expanded matrices stay manual; do not replace ordinary required checks.
# - Use explicit Bash for gates, archive verification, and evidence rendering.

name: Release candidate validation
run-name: Release candidate validation on ${{ github.ref_name }}

# Select the candidate branch/ref in GitHub's manual-run UI. Never publishes.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate library (Python ${{ matrix.python-version }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup-python-project
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-path: requirements-dev.txt
          install-command: python -m pip install -r requirements-dev.txt
      - name: Install validation tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          command -v shellcheck
      - run: make check

  python:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    uses: ./.github/workflows/python-ci.yml
    with:
      runs-on: ${{ matrix.runner }}
      working-directory: tests/fixtures/python

  package:
    permissions:
      contents: read
    uses: ./.github/workflows/python-package.yml
    with:
      python-version: '3.13'
      working-directory: tests/fixtures/python
      artifact-name: candidate-python-dist-3.13
      smoke-command: python -c 'import dagitali_fixture; assert dagitali_fixture.add(2, 3) == 5'

  package-python314:
    permissions:
      contents: read
    uses: ./.github/workflows/python-package.yml
    with:
      python-version: '3.14'
      working-directory: tests/fixtures/python
      artifact-name: candidate-python-dist-3.14
      smoke-command: python -c 'import dagitali_fixture; assert dagitali_fixture.add(2, 3) == 5'

  package-consumer:
    needs: [package, package-python314]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - name: Validate returned artifact metadata
        env:
          ARTIFACT_ID: ${{ matrix.python == '3.13' && needs.package.outputs.artifact-id || needs.package-python314.outputs.artifact-id }}
          ARTIFACT_URL: ${{ matrix.python == '3.13' && needs.package.outputs.artifact-url || needs.package-python314.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ matrix.python == '3.13' && needs.package.outputs.artifact-digest || needs.package-python314.outputs.artifact-digest }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_URL" == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$ARTIFACT_ID" ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[a-f0-9]{64}$ ]]
      - name: Download distribution by returned ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ matrix.python == '3.13' && needs.package.outputs.artifact-id || needs.package-python314.outputs.artifact-id }}
          path: downloaded
          skip-decompress: true
          digest-mismatch: error
      - name: Verify downloaded distributions
        env:
          ARTIFACT_DIGEST: ${{ matrix.python == '3.13' && needs.package.outputs.artifact-digest || needs.package-python314.outputs.artifact-digest }}
        run: |
          shopt -s nullglob
          archives=(downloaded/*)
          (( ${#archives[@]} == 1 ))
          actual_digest=$(sha256sum "${archives[0]}")
          [[ "${actual_digest%% *}" == "$ARTIFACT_DIGEST" ]]
          unzip -q "${archives[0]}" -d distributions
          wheels=(distributions/*.whl)
          sdists=(distributions/*.tar.gz)
          (( ${#wheels[@]} == 1 && ${#sdists[@]} == 1 ))
          [[ $(find distributions -type f | wc -l) -eq 2 ]]
          unzip -t "${wheels[0]}"
          tar -tzf "${sdists[0]}" > /dev/null

  cdk:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture: [node-cdk, node-cdk-locked]
    uses: ./.github/workflows/aws-cdk-ci.yml
    with:
      language: node
      cdk-version: '2.1144.0'
      working-directory: tests/fixtures/${{ matrix.fixture }}
      prepare-command: ${{ matrix.fixture == 'node-cdk-locked' && 'cp tests/fixtures/node-cdk/{app.js,app.test.js,package.json,cdk.json} tests/fixtures/node-cdk-locked/' || '' }}
      test-command: npm test

  swift:
    permissions:
      contents: read
    uses: ./.github/workflows/swift-ci.yml
    with:
      runners: '["macos-15", "macos-latest"]'
      working-directory: tests/fixtures/swift
      build-command: swift build --build-tests > build.log 2>&1
      test-command: swift test --parallel > test.log 2>&1
      diagnostics-path: |
        tests/fixtures/swift/build.log
        tests/fixtures/swift/test.log

  python-cdk:
    permissions:
      contents: read
    uses: ./.github/workflows/aws-cdk-ci.yml
    with:
      language: python
      cdk-version: '2.1144.0'
      working-directory: tests/fixtures/python-cdk
      format-command: ruff format --check .
      lint-command: ruff check .
      test-command: pytest --junitxml=test-results.xml
      synth-command: cdk synth --quiet > synth.log 2>&1
      diagnostics-name: candidate-python-cdk-diagnostics
      diagnostics-path: |
        tests/fixtures/python-cdk/test-results.xml
        tests/fixtures/python-cdk/synth.log

  dependency-audit:
    permissions:
      contents: read
    uses: ./.github/workflows/python-dependency-audit.yml
    with:
      working-directory: tests/fixtures/python-cdk
      project-distribution: dagitali-python-cdk-fixture

  dependency-inventory:
    permissions:
      contents: read
    uses: ./.github/workflows/python-sbom.yml
    with:
      working-directory: tests/fixtures/python-cdk

  summary:
    # Tool pins stay fixed while only their transitive resolution varies.
    # Boundaries are supplementary; inspect all matrix legs independently.
    if: ${{ always() }}
    needs: [validate, python, package, package-python314, package-consumer, cdk, swift, python-cdk, dependency-audit, dependency-inventory, audit-boundaries, inventory-boundaries]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Report candidate evidence
        env:
          RESULTS: ${{ toJSON(needs) }}
          CANDIDATE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections.abc import Mapping
          from typing import Any

          def write_summary(
              results: Mapping[str, Mapping[str, Any]],
              candidate_sha: str,
              run_url: str,
              report_path: str,
          ) -> None:
              """Append aggregate candidate evidence without querying hosted state.

              The supplied path is GitHub's summary file; existing content is
              retained. Missing artifact links remain explicit. Mapping fields
              follow GitHub's needs payload; annotations do not validate it.
              File errors and malformed payloads propagate to fail the job.
              """
              with open(report_path, 'a', encoding='utf-8') as report:
                  report.write(f"## Candidate `{candidate_sha}`\n\n")
                  report.write('Library/package: Python 3.13/3.14; Python CI: Ubuntu 24.04/macOS 15; '
                               'CDK: locked/unlocked Node and Python; Swift: macOS 15/latest.\n\n')
                  report.write('| Job | Outcome |\n| --- | --- |\n')
                  for name, job in results.items():
                      report.write(f"| {name} | {job['result']} |\n")
                  for name in ('package', 'package-python314'):
                      outputs = results[name].get('outputs', {})
                      url = outputs.get('artifact-url', '')
                      report.write(f"\n{name}: {url or 'No artifact evidence available'}\n")
                  report.write('\nMatrix outcomes are aggregate; inspect job legs for individual '
                               'results. Skipped/cancelled checks are missing evidence, not passes.\n')
                  report.write(f"\nInspection evidence: {run_url}#artifacts\n")
                  for name in ('dependency-audit', 'dependency-inventory'):
                      outputs = results.get(name, {}).get('outputs', {})
                      report.write(f"\n{name}: {outputs.get('artifact-url') or 'No returned artifact link; inspect run artifacts'}\n")
                  report.write('Audit/inventory jobs include default, lowest, and highest tool '
                               'dependency resolution. Inspect their summaries and named artifacts; '
                               'a run link alone does not prove that any report exists.\n')

          results: dict[str, dict[str, Any]] = json.loads(os.environ['RESULTS'])
          write_summary(
              results, os.environ['CANDIDATE_SHA'], os.environ['RUN_URL'],
              os.environ['GITHUB_STEP_SUMMARY'],
          )
          if any(job['result'] != 'success' for job in results.values()):
              raise SystemExit('Candidate validation is incomplete or failed')
          PY

  audit-boundaries:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        resolution: [lowest, highest]
    uses: ./.github/workflows/python-dependency-audit.yml
    with:
      working-directory: tests/fixtures/python-cdk
      project-distribution: dagitali-python-cdk-fixture
      tool-dependency-resolution: ${{ matrix.resolution }}
      artifact-name: candidate-audit-${{ matrix.resolution }}
      tool-constraints-path: requirements/inspection-constraints.txt

  inventory-boundaries:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        resolution: [lowest, highest]
    uses: ./.github/workflows/python-sbom.yml
    with:
      working-directory: tests/fixtures/python-cdk
      tool-dependency-resolution: ${{ matrix.resolution }}
      artifact-name: candidate-inventory-${{ matrix.resolution }}
      tool-constraints-path: requirements/inspection-constraints.txt
