name: Reusable Swift CI

on:
  workflow_call:
    inputs:
      runners:
        description: JSON array of macOS runner labels.
        type: string
        default: '["macos-15"]'
      working-directory:
        description: Directory containing Package.swift.
        type: string
        default: .
      build-command:
        description: Swift build command; empty skips it.
        type: string
        default: swift build --build-tests
      test-command:
        description: Swift test command; empty skips it.
        type: string
        default: swift test --parallel
      diagnostics-path:
        description: Optional report/log paths relative to checkout; empty disables upload.
        type: string
        default: ''
      diagnostics-name:
        description: Diagnostic artifact prefix; runner label is appended.
        type: string
        default: swift-diagnostics
      diagnostics-retention-days:
        description: Diagnostic retention in days, subject to repository limits.
        type: number
        default: 7

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Swift on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Build
        if: inputs.build-command != ''
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Test
        if: inputs.test-command != ''
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Upload diagnostics
        if: ${{ always() && !cancelled() && inputs.diagnostics-path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.diagnostics-name }}-${{ matrix.runner }}
          path: ${{ inputs.diagnostics-path }}
          if-no-files-found: warn
          retention-days: ${{ inputs.diagnostics-retention-days }}
