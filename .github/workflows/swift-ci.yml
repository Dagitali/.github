# $schema: https://json.schemastore.org/github-workflow.json
# .github/workflows/swift-ci.yml
# Dagitali shared automation library
#
# Responsibilities
# - Build and test Swift packages on caller-selected macOS runners.
#
# Maintainer Notes
# - This is not an Xcode application, signing, or distribution workflow.
# - Caller workflows own triggers and cancellation, not this shared workflow.
# - Retain every runner result and diagnostics after build/test failures.

---
name: Reusable Swift CI

on:
  workflow_call:
    inputs:
      runners:
        description: JSON array of macOS runner labels.
        type: string
        default: '["macos-15"]'
      working-directory:
        description: Directory containing Package.swift.
        type: string
        default: .
      build-command:
        description: Swift build command; empty skips it.
        type: string
        default: swift build --build-tests
      test-command:
        description: Swift test command; empty skips it.
        type: string
        default: swift test --parallel
      diagnostics-path:
        description: Optional report/log paths relative to checkout; empty disables upload.
        type: string
        default: ''
      diagnostics-name:
        description: Diagnostic artifact prefix; runner label is appended.
        type: string
        default: swift-diagnostics
      diagnostics-retention-days:
        description: Diagnostic retention in days, subject to repository limits.
        type: number
        default: 7

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Swift on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Build
        if: inputs.build-command != ''
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Test
        if: inputs.test-command != ''
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Upload diagnostics
        if: ${{ always() && !cancelled() && inputs.diagnostics-path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.diagnostics-name }}-${{ matrix.runner }}
          path: ${{ inputs.diagnostics-path }}
          if-no-files-found: warn
          retention-days: ${{ inputs.diagnostics-retention-days }}
