name: Automation library CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install validation tools
        run: |
          python -m pip install -r requirements-dev.txt
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          command -v shellcheck
      - run: make check

  python:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/python

  package:
    uses: ./.github/workflows/python-package.yml
    with:
      working-directory: tests/fixtures/python
      smoke-command: python -c 'import dagitali_fixture; assert dagitali_fixture.add(2, 3) == 5'

  cdk:
    strategy:
      matrix:
        fixture: [node-cdk, node-cdk-locked]
    uses: ./.github/workflows/aws-cdk-ci.yml
    with:
      language: node
      cdk-version: '2.1144.0'
      working-directory: tests/fixtures/${{ matrix.fixture }}
      prepare-command: ${{ matrix.fixture == 'node-cdk-locked' && 'cp tests/fixtures/node-cdk/{app.js,app.test.js,package.json,cdk.json} tests/fixtures/node-cdk-locked/' || '' }}
      test-command: npm test

  swift:
    uses: ./.github/workflows/swift-ci.yml
    with:
      working-directory: tests/fixtures/swift

  composites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./actions/setup-python-project
        with:
          working-directory: tests/fixtures/python
      - uses: ./actions/python-quality
        with:
          working-directory: tests/fixtures/python
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install CDK tooling
        working-directory: tests/fixtures/node-cdk
        run: |
          npm install
          npm install --global aws-cdk@2.1144.0
          cdk --version
      - uses: ./actions/cdk-quality
        with:
          working-directory: tests/fixtures/node-cdk
          test-command: npm test
