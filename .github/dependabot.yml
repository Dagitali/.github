# .github/dependabot.yml
# Dagitali shared automation library
#
# Responsibilities
# - Propose reviewable dependency and hook updates.
# - Route routine version updates through review on develop.
# - Retain separate validation-tool and consumer-fixture coverage.
#
# Maintainer Notes
# - Target develop for version updates in every configured ecosystem.
# - Keep this configuration on the default branch so GitHub can read it.
# - Security-update pull requests still target the default branch.
# - Omit labels to retain Dependabot's automatic dependency/ecosystem labels.
# - Retain immutable Actions pins after accepting dependency updates.
# - Use UTC for predictable schedules; keep ecosystem updates staggered.

---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Etc/UTC
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: pip
    directories:
      - /
      - /tests/fixtures/python
      - /tests/fixtures/python-cdk
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC
    commit-message:
      prefix: build
      include: scope
    groups:
      python-validation-tools:
        patterns:
          - popo
          - pytest
          - ruff
          - mypy
          - PyYAML
          - pyyaml
          - types-*
      python-runtime-dependencies:
        dependency-type: production
      python-development-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directories:
      - /tests/fixtures/node-cdk
      - /tests/fixtures/node-cdk-locked
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:15'
      timezone: Etc/UTC
    commit-message:
      prefix: build
      include: scope
    groups:
      fixture-dependencies:
        patterns:
          - '*'

  - package-ecosystem: pre-commit
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Etc/UTC
    commit-message:
      prefix: build
      include: scope
    groups:
      pre-commit-hooks:
        patterns:
          - '*'
