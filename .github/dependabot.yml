version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /tests/fixtures/node-cdk
      - /tests/fixtures/node-cdk-locked
    schedule:
      interval: weekly
    groups:
      fixture-dependencies:
        patterns: ['*']
