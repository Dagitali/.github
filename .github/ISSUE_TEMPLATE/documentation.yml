# .github/ISSUE_TEMPLATE/documentation.yml
# Dagitali organization default
#
# Responsibilities
# - Gather documentation locations, concerns, and suggested corrections.
# - Invite public supporting evidence and accessibility concerns.
#
# Maintainer Notes
# - Keep requests actionable without requiring project-specific tooling.
# - Preserve existing field IDs, labels, and requiredness for consumers.
# - Focus on actionable accuracy, evidence, and accessibility corrections.

---
name: Documentation Improvement
description: Report missing, unclear, outdated, unsupported, or inaccessible documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: >-
        Identify a public documentation problem without including credentials,
        private data, confidential evidence, or suspected vulnerability details.
        Report suspected vulnerabilities privately through the affected
        repository's security policy, not in this public form.
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Provide the public URL, repository path, heading, or line reference.
      placeholder: README.md#configuration
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Documentation concern
      description: Explain what is missing, unclear, outdated, incorrect, unsupported, or inaccessible.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction and evidence
      description: >-
        Describe the wording, example, or structure that would help. Link public
        implementation, test, release, or primary-source evidence when available.
  - type: dropdown
    id: impact
    attributes:
      label: Primary impact
      description: Select the primary impact, if known; leave blank if unsure.
      options:
        - Accuracy or completeness
        - Accessibility or clarity
        - Compatibility or migration
        - Security or privacy guidance
        - Stale link or reference
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
