# .github/ISSUE_TEMPLATE/documentation.yml
# Dagitali organization default
#
# Responsibilities
# - Gather documentation locations, concerns, and suggested corrections.
# - Invite public supporting evidence and accessibility concerns.
#
# Maintainer Notes
# - Keep requests actionable without requiring project-specific tooling.

name: Documentation improvement
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: >-
        Identify a public documentation problem without including credentials,
        private data, confidential evidence, or suspected vulnerability details.
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Provide the public URL or repository path, heading, or line reference.
      placeholder: https://github.com/Dagitali/...
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs improvement?
      description: Explain what is missing, unclear, outdated, incorrect, unsupported, or inaccessible.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: >-
        Describe the wording, example, or structure that would help. Link public
        implementation, test, release, or primary-source evidence when available.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
