# .github/ISSUE_TEMPLATE/config.yml
# Dagitali organization default
#
# Responsibilities
# - Route issue reports, usage questions, and private security disclosures.
# - Allow blank issues when the structured forms do not fit a report.
#
# Maintainer Notes
# - Preserve blank-issue policy and verify channels before changing links.
# - Keep navigation aligned with the affected project's reporting surfaces.
#
# References
# - GitHub issue forms syntax:
#   https://docs.github.com/en/repositories/
#   managing-your-repositorys-settings-and-features/
#   customizing-your-repository/syntax-for-issue-forms
# - GitHub issue template chooser configuration:
#   https://docs.github.com/en/repositories/
#   managing-your-repositorys-settings-and-features/
#   customizing-your-repository/configuring-issue-templates-for-your-repository

---
blank_issues_enabled: true
contact_links:
  - name: Usage questions and support
    url: https://github.com/Dagitali/.github/blob/main/SUPPORT.md
    about: Follow the affected project's support instructions and available channels.
  - name: Security vulnerability
    url: https://github.com/Dagitali/.github/blob/main/SECURITY.md
    about: Follow the private reporting instructions for the affected repository.
