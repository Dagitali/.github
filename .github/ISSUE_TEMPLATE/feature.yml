# .github/ISSUE_TEMPLATE/feature.yml
# Dagitali organization default
#
# Responsibilities
# - Gather problems, proposed outcomes, and considered alternatives.
# - Invite observable outcomes and compatibility considerations.
#
# Maintainer Notes
# - Preserve existing field IDs, labels, and requiredness for consumers.

---
name: Feature request
description: Propose an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Tell us about the problem you want to solve and the outcome you need before
        prescribing an implementation. Do not include credentials, private data,
        confidential evidence, or suspected vulnerability details in public issues.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What need, limitation, or opportunity does this address?
      placeholder: Describe the current need or pain point.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and observable outcomes that would make it complete.
      placeholder: Describe the requested improvement.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Describe relevant workarounds or alternatives and why they are
        insufficient.
  - type: textarea
    id: examples
    attributes:
      label: Example
      description: Include sanitized example configuration, commands, code, or output.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >-
        Add public examples, sketches, links, or other relevant details. Note
        compatibility, migration, security, privacy, operational, or cost impacts
        where applicable.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
