# .github/ISSUE_TEMPLATE/bug.yml
# Dagitali organization default
#
# Responsibilities
# - Gather actionable reproduction, expectations, and environment details.
#
# Maintainer Notes
# - Keep organization defaults product-neutral and reports free of secrets.

name: Bug report
description: Report reproducible incorrect or unexpected behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable set of steps that demonstrates the problem.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant versions, operating system, browser, runtime, or deployment details.
      placeholder: |
        Project version or commit:
        Operating system:
        Runtime or browser:
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add logs, screenshots, or other context. Remove secrets and personal data first.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and sensitive information from this report.
          required: true
