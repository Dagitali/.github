# .github/ISSUE_TEMPLATE/bug.yml
# Dagitali organization default
#
# Responsibilities
# - Gather actionable reproduction, expectations, and environment details.
# - Prompt public-safe evidence without requiring project-specific tooling.
#
# Maintainer Notes
# - Keep organization defaults product-neutral and reports free of secrets.
# - Preserve existing field IDs, labels, and requiredness for consumers.

---
name: Bug report
description: Report reproducible incorrect or unexpected behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for taking the time to report a problem. Do not include credentials,
        private data, or confidential evidence. Report suspected vulnerabilities
        privately through the repository's security policy, not in a public issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what went wrong, its impact, and relevant output or exit codes.
      placeholder: What is broken, and how does it affect you?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        Provide the smallest reliable reproduction, including exact commands,
        configuration, and sample inputs where relevant. Remove sensitive values.
        State whether you reproduced this with a supported release or the current
        default branch, or explain why that was not possible.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Include sanitized errors, tracebacks, logs, or failing assertions.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Include the version or commit, installation or invocation method, operating
        system, and relevant tool, runtime, browser, or service versions. State
        whether the failure occurred locally or in CI.
        Where relevant, include device or simulator details, permission settings,
        connectivity, and synchronization context without exposing account details
        or private location history.
      placeholder: |
        Project version or commit:
        Operating system:
        Runtime or browser:
        Installation or invocation method:
        Local or CI execution:
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add logs, screenshots, or other context. Remove secrets and personal data first.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and sensitive information from this report.
          required: true
