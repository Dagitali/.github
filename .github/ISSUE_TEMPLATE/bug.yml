# .github/ISSUE_TEMPLATE/bug.yml
# Dagitali organization default
#
# Responsibilities
# - Gather actionable reproduction, expectations, and environment details.
# - Prompt public-safe evidence without requiring project-specific tooling.
#
# Maintainer Notes
# - Keep organization defaults product-neutral and reports free of secrets.
# - Preserve field IDs and labels; require actionable reproduction context.
# - Allow unknown or inapplicable version and environment information.
# - Keep prompts product-neutral unless specific context improves triage.
#
# References
# - GitHub issue templates:
#   https://docs.github.com/en/repositories/
#   managing-your-repositorys-settings-and-features/
#   customizing-your-repository/configuring-issue-templates-for-your-repository
# - GitHub issue forms syntax:
#   https://docs.github.com/en/repositories/
#   managing-your-repositorys-settings-and-features/
#   customizing-your-repository/syntax-for-issue-forms

---
name: Bug Report
description: Report a reproducible problem or defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for taking the time to report a problem. Do not include credentials,
        private data, or confidential evidence. Report suspected vulnerabilities
        privately through the repository's security policy, not in a public issue.
  - type: textarea
    id: description
    attributes:
      label: Summary and observed behavior
      description: Describe what went wrong, its impact, and relevant output or exit codes.
      placeholder: What is broken, and how does it affect you?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        Provide the smallest reliable reproduction, including exact commands,
        configuration, and sample inputs where relevant. Remove sensitive values.
        State whether you reproduced this with a supported release or the current
        default branch, or explain why that was not possible.
      placeholder: |
        1. Install or check out ...
        2. Configure ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Include sanitized errors, tracebacks, logs, or failing assertions.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: >-
        Identify the project release, package version, tag, or commit tested.
        Enter "unknown" or "not applicable" when appropriate.
      placeholder: Version, tag, commit, unknown, or not applicable
    validations:
      required: true
  - type: input
    id: installation
    attributes:
      label: Installation or invocation method
      description: Explain how the software was installed or invoked, if applicable.
      placeholder: Package manager, editable install, source checkout, or other
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Include the operating system and relevant language, runtime, tool,
        browser, or service versions. State whether execution was local or in CI.
        Where relevant, include device or simulator details, permission settings,
        connectivity, and synchronization context without exposing account details
        or private location history.
        Enter "unknown" or "not applicable" for information you cannot provide
        or that does not apply to this report.
      placeholder: |
        Operating system:
        Runtime or browser:
        Local or CI execution:
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add logs, screenshots, or other context. Remove secrets and personal data first.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets and sensitive information from this report.
          required: true
