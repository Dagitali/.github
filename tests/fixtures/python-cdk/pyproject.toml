# tests/fixtures/python-cdk/pyproject.toml
# Dagitali shared automation library
#
# Responsibilities
# - Declare an independently installable runtime fixture.
#
# Maintainer Notes
# - Keep fixture dependencies separate from root validation policy; never
# publish.

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dagitali-python-cdk-fixture"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["aws-cdk-lib==2.269.0", "constructs==10.8.1"]

[project.optional-dependencies]
dev = ["ruff==0.16.10", "pytest==9.1.1"]

[tool.pytest]
minversion = "9.1.1"
testpaths = ["."]
addopts = ["--strict-config", "--strict-markers"]

# Keep standalone fixture formatting aligned when copied outside the checkout.
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.format]
quote-style = "single"
nested-string-quote-style = "preferred"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.setuptools]
py-modules = ["app"]
