# tests/fixtures/python-cdk/pyproject.toml
# Dagitali shared automation library
#
# Responsibilities: Declare an independently installable runtime fixture.
#
# Maintainer Notes: Keep fixture dependencies separate from root validation
# policy; never publish.

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dagitali-python-cdk-fixture"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["aws-cdk-lib==2.269.0", "constructs==10.8.1"]

[project.optional-dependencies]
dev = ["ruff==0.11.13", "pytest==9.1.1"]

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
minversion = "9.1.1"
testpaths = ["."]
addopts = "--strict-config --strict-markers"
