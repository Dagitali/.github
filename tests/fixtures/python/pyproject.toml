# tests/fixtures/python/pyproject.toml
# Dagitali shared automation library
#
# Responsibilities
# - Declare an independently installable runtime fixture.
#
# Maintainer Notes
# - Keep fixture dependencies separate from root validation policy; never
# publish.

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dagitali-ci-fixture"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = ["ruff==0.11.13", "mypy==1.15.0", "pytest==9.1.1"]

[tool.pytest.ini_options]
minversion = "9.1.1"
testpaths = ["."]
addopts = "--strict-config --strict-markers"

[tool.setuptools]
py-modules = ["dagitali_fixture"]

[tool.mypy]
strict = true
